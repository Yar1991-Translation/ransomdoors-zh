name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore rans0m.csproj -r win-x64

      - name: Build
        run: dotnet build rans0m.csproj -c Release -r win-x64 --no-restore

      - name: Publish
        run: dotnet publish rans0m.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true --no-restore -o artifacts/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rans0m-zh-win-x64
          path: artifacts/publish/
          retention-days: 14
          if-no-files-found: error
